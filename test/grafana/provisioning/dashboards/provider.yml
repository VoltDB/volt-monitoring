apiVersion: 1
providers:
  - name: volt
    type: file
    allowUiUpdates: true
    options:
      # The dashboard set under test is bind-mounted here by docker-compose
      # (see DASHBOARDS in .env / run.sh). Defaults to the V15.x set.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
