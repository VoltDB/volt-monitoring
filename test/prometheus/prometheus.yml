global:
  scrape_interval: 3s      # ~half the 6s metric interval (Nyquist)
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/voltdb-alerts.yml

scrape_configs:
  - job_name: voltdb
    metrics_path: /metrics
    static_configs:
      - targets:
          - voltdb:11781
        labels:
          # The dashboards filter on `namespace`; on Kubernetes the Operator
          # injects it, so we set it explicitly here to match.
          namespace: test-volt
