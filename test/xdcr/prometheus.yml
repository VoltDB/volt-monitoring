global:
  scrape_interval: 3s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/voltdb-alerts.yml

scrape_configs:
  - job_name: voltdb
    metrics_path: /metrics
    static_configs:
      - targets: ["volta:11781"]
        labels:
          namespace: test-volt-a
      - targets: ["voltb:11781"]
        labels:
          namespace: test-volt-b
