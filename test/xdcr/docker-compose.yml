# Two-cluster XDCR test stack. Both clusters peer over the DR port (5555) on the
# shared compose network and are scraped by one Prometheus with distinct
# `namespace` labels (test-volt-a / test-volt-b).
services:
  volta:
    image: ${VOLTDB_IMAGE:?set VOLTDB_IMAGE in .env}
    container_name: volt-xdcr-a
    hostname: volta
    stdin_open: true
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - "voltdb init --force -D /tmp --license=/etc/voltdb-license.xml -C /etc/voltdb/deployment.yaml && exec voltdb start -D /tmp/ -c 1 -H localhost --ignore=thp"
    healthcheck:
      test: ["CMD-SHELL", "/opt/voltdb/bin/voltadmin status --host=localhost >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    ports:
      - "21212:21212"
      - "11781:11781"
    volumes:
      - ./license.xml:/etc/voltdb-license.xml:ro
      - ./deployment-a.yaml:/etc/voltdb/deployment.yaml:ro
    networks: [xdcr]

  voltb:
    image: ${VOLTDB_IMAGE:?set VOLTDB_IMAGE in .env}
    container_name: volt-xdcr-b
    hostname: voltb
    stdin_open: true
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - "voltdb init --force -D /tmp --license=/etc/voltdb-license.xml -C /etc/voltdb/deployment.yaml && exec voltdb start -D /tmp/ -c 1 -H localhost --ignore=thp"
    healthcheck:
      test: ["CMD-SHELL", "/opt/voltdb/bin/voltadmin status --host=localhost >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    ports:
      - "21213:21212"
      - "11782:11781"
    volumes:
      - ./license.xml:/etc/voltdb-license.xml:ro
      - ./deployment-b.yaml:/etc/voltdb/deployment.yaml:ro
    networks: [xdcr]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: volt-xdcr-prometheus
    depends_on:
      volta: { condition: service_healthy }
      voltb: { condition: service_healthy }
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../prometheus/voltdb-alerts.yml:/etc/prometheus/voltdb-alerts.yml:ro
    networks: [xdcr]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: volt-xdcr-grafana
    depends_on: [prometheus]
    environment:
      GF_INSTALL_PLUGINS: marcusolsson-treemap-panel
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ${DASHBOARDS:-../../dashboards/Volt-V15.x}:/var/lib/grafana/dashboards:ro
    networks: [xdcr]

networks:
  xdcr:
